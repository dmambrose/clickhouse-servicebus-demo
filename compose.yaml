name: clickhouse-csharp-demo
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: demo
      CLICKHOUSE_USER: demo
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-demo_password}
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user demo --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s
  ui:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:${UI_PORT:-5088}:8080"
    environment:
      CLICKHOUSE_CONNECTION_STRING: "Host=clickhouse;Port=8123;Protocol=http;Database=demo;Username=demo;Password=${CLICKHOUSE_PASSWORD:-demo_password};UseCustomDecimals=false;Timeout=30"
    depends_on:
      clickhouse:
        condition: service_healthy
  demo:
    build: .
    profiles: ["demo"]
    environment:
      CLICKHOUSE_CONNECTION_STRING: "Host=clickhouse;Port=8123;Protocol=http;Database=demo;Username=demo;Password=${CLICKHOUSE_PASSWORD:-demo_password};UseCustomDecimals=false;Timeout=30"
    depends_on:
      clickhouse:
        condition: service_healthy
volumes:
  clickhouse-data:
